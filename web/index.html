<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Rampage — Find Good Set (Web)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Inventory Rampage</h1>
      <p class="sub">Find Good Set · Web-версия</p>
    </header>

    <section class="card">
      <h2>Режим поиска</h2>
      <div class="row">
        <label><input type="radio" name="mode" value="damage" checked /> Урон</label>
        <label><input type="radio" name="mode" value="armor" /> Броня</label>
      </div>
      <div class="row">
        <label>Топ результатов <input type="number" id="topN" value="20" min="1" max="100" /></label>
        <label><input type="checkbox" id="includeUpcoming" checked /> Включать upcoming</label>
      </div>
    </section>

    <section class="card">
      <h2>Диапазоны (min – max)</h2>
      <div class="filters" id="filters"></div>
    </section>

    <section class="card">
      <h2>Чёрный список</h2>
      <div class="blacklist-block">
        <h3>Предметы</h3>
        <div class="row">
          <input type="text" id="bl-item" placeholder="Название предмета" />
          <button type="button" data-add="items">+</button>
        </div>
        <div class="tags" id="tags-items"></div>
      </div>
      <div class="blacklist-block">
        <h3>Тоники</h3>
        <div class="row">
          <input type="text" id="bl-tonic" placeholder="Название тоника" />
          <button type="button" data-add="tonics">+</button>
        </div>
        <div class="tags" id="tags-tonics"></div>
      </div>
      <div class="blacklist-block">
        <h3>Классы</h3>
        <div class="row">
          <input type="text" id="bl-class" placeholder="Название класса" />
          <button type="button" data-add="classes">+</button>
        </div>
        <div class="tags" id="tags-classes"></div>
      </div>
      <div class="blacklist-block">
        <h3>Элементы</h3>
        <div class="row">
          <input type="text" id="bl-element" placeholder="darkness / fire / …" />
          <button type="button" data-add="elements">+</button>
        </div>
        <div class="tags" id="tags-elements"></div>
      </div>
    </section>

    <section class="card">
      <h2>Данные</h2>
      <p class="hint">Вставь JSON с предметами / классами / тониками или загрузи файл. Формат совместим с приложением.</p>
      <textarea id="dataJson" rows="8" placeholder='{"items":[...],"classes":[...],"beverages":[...]}'></textarea>
      <div class="row">
        <input type="file" id="fileInput" accept=".json,application/json" />
        <button type="button" id="loadDemo">Демо-данные</button>
      </div>
    </section>

    <div class="actions">
      <button type="button" id="btnSearch" class="primary">Искать сеты</button>
      <button type="button" id="btnClear">Очистить результаты</button>
    </div>

    <section class="card" id="statusCard" hidden>
      <p id="status"></p>
    </section>

    <section class="card" id="resultsCard" hidden>
      <h2>Результаты <span id="resultsMeta"></span></h2>
      <div id="results"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
